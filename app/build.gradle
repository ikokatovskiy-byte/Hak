plugins {
        id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            }

            android {
                namespace 'com.cameragallery.core'
                    compileSdk 34

                        defaultConfig {
                                applicationId "com.cameragallery.core"
                                        minSdk 29
                                                targetSdk 34
                                                        versionCode 1
                                                                versionName "1.0"
                                                                    }

                                                                        buildTypes {
                                                                                release {
                                                                                            minifyEnabled false
                                                                                                    }
                                                                                                        }
                                                                                                            compileOptions {
                                                                                                                    sourceCompatibility JavaVersion.VERSION_17
                                                                                                                            targetCompatibility JavaVersion.VERSION_17
                                                                                                                                }
                                                                                                                                    kotlinOptions {
                                                                                                                                            jvmTarget = '17'
                                                                                                                                                }
                                                                                                                                                }

                                                                                                                                                dependencies {
                                                                                                                                                    implementation 'androidx.appcompat:appcompat:1.6.1'
                                                                                                                                                        implementation 'androidx.activity:activity-ktx:1.8.0'
                                                                                                                                                }